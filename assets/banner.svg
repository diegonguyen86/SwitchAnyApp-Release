<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a10"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9fb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9adffd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <clipPath id="win"><rect x="660" y="58" width="560" height="330" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>
  <rect width="1280" height="440" fill="url(#glow2)"/>

  <!-- Biểu tượng -->
  <g transform="translate(72 92)">
    <rect width="76" height="76" rx="18" fill="#10141c" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M14 13 H62 V40 C62 56 50 66 38 66 C26 66 14 56 14 40 Z" fill="url(#shield)"/>
    <path d="M24 31 H48 M42 25 L49 31 L42 37" fill="none" stroke="#0b0f16" stroke-width="5" stroke-linecap="square"/>
    <path d="M52 45 H28 M34 39 L27 45 L34 51" fill="none" stroke="#0b0f16" stroke-width="5" stroke-linecap="square"/>
  </g>
  <text x="168" y="128" font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="3">WINDOWS · TAURI 2 · RUST</text>
  <text x="168" y="158" font-size="15" fill="#8a94a6">Trình quản lý game &amp; tài khoản Steam</text>

  <text x="72" y="248" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="-2">SwitchAnyAcc</text>
  <text x="74" y="294" font-size="24" font-weight="600" fill="#e2e8f0">Một kho game. Mọi tài khoản. Một cú bấm.</text>
  <text x="74" y="326" font-size="16" fill="#8a94a6">Đổi tài khoản tức thì · Offline chặn mạng · Gộp mọi launcher</text>

  <!-- Chip nguồn -->
  <g font-size="13" font-weight="600" fill="#cbd5e1">
    <g transform="translate(72 352)"><rect width="66" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="33" y="19" text-anchor="middle">Steam</text></g>
    <g transform="translate(146 352)"><rect width="54" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="27" y="19" text-anchor="middle">Epic</text></g>
    <g transform="translate(208 352)"><rect width="52" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="26" y="19" text-anchor="middle">GOG</text></g>
    <g transform="translate(268 352)"><rect width="74" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="37" y="19" text-anchor="middle">Ubisoft</text></g>
    <g transform="translate(350 352)"><rect width="44" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="22" y="19" text-anchor="middle">EA</text></g>
    <g transform="translate(402 352)"><rect width="90" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="45" y="19" text-anchor="middle">Battle.net</text></g>
    <g transform="translate(500 352)"><rect width="52" height="28" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/><text x="26" y="19" text-anchor="middle">Riot</text></g>
    <g transform="translate(560 352)"><rect width="34" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/><text x="17" y="19" text-anchor="middle" fill="#7dd3fc">+</text></g>
  </g>

  <!-- Cửa sổ app mô phỏng -->
  <g filter="url(#shadow)">
    <rect x="660" y="58" width="560" height="330" rx="14" fill="#0b0f16" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>
  <g clip-path="url(#win)">
    <!-- thanh trên -->
    <rect x="660" y="58" width="560" height="34" fill="#0f131b"/>
    <rect x="726" y="67" width="190" height="16" rx="5" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="1150" cy="75" r="4" fill="#34d399"/>
    <rect x="1160" y="71" width="40" height="8" rx="4" fill="#34d399" fill-opacity="0.35"/>
    <!-- thanh icon trái -->
    <rect x="660" y="92" width="52" height="296" fill="#0f131b"/>
    <path d="M674 106 H698 V118 C698 126 692 131 686 131 C680 131 674 126 674 118 Z" fill="#38bdf8"/>
    <rect x="676" y="148" width="20" height="20" rx="6" fill="#38bdf8" fill-opacity="0.18"/>
    <rect x="676" y="182" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="676" y="216" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="686" cy="362" r="11" fill="#6366f1"/>
    <!-- tiêu đề + hero -->
    <text x="730" y="122" font-size="17" font-weight="700" fill="#f1f5f9">Kho game</text>
    <rect x="730" y="134" width="470" height="62" rx="10" fill="#121826" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="738" y="142" width="96" height="46" rx="7" fill="url(#c2)"/>
    <text x="846" y="158" font-size="10" fill="#8a94a6">Tiếp tục chơi</text>
    <text x="846" y="176" font-size="14" font-weight="700" fill="#f1f5f9">Neon Horizon</text>
    <rect x="1108" y="152" width="82" height="26" rx="8" fill="#38bdf8"/>
    <text x="1149" y="169" font-size="11" font-weight="700" fill="#06101c" text-anchor="middle">▶ Chơi ngay</text>
    <!-- lưới game -->
    <g>
      <rect x="730" y="210" width="112" height="78" rx="9" fill="url(#c1)"/>
      <rect x="850" y="210" width="112" height="78" rx="9" fill="url(#c3)"/>
      <rect x="970" y="210" width="112" height="78" rx="9" fill="url(#c4)"/>
      <rect x="1090" y="210" width="112" height="78" rx="9" fill="url(#c5)"/>
      <rect x="730" y="296" width="112" height="78" rx="9" fill="url(#c6)"/>
      <rect x="850" y="296" width="112" height="78" rx="9" fill="url(#c2)"/>
      <rect x="970" y="296" width="112" height="78" rx="9" fill="url(#c1)"/>
      <rect x="1090" y="296" width="112" height="78" rx="9" fill="url(#c3)"/>
    </g>
    <g font-size="9" font-weight="700">
      <rect x="736" y="216" width="44" height="15" rx="4" fill="#000" fill-opacity="0.55"/><text x="758" y="227" text-anchor="middle" fill="#34d399">Đã cài</text>
      <rect x="856" y="216" width="38" height="15" rx="4" fill="#000" fill-opacity="0.55"/><text x="875" y="227" text-anchor="middle" fill="#e2e8f0">Epic</text>
      <rect x="976" y="216" width="56" height="15" rx="4" fill="#34d399"/><text x="1004" y="227" text-anchor="middle" fill="#06101c">Đang chạy</text>
      <rect x="1096" y="216" width="38" height="15" rx="4" fill="#000" fill-opacity="0.55"/><text x="1115" y="227" text-anchor="middle" fill="#e2e8f0">Riot</text>
      <rect x="736" y="302" width="44" height="15" rx="4" fill="#000" fill-opacity="0.55"/><text x="758" y="313" text-anchor="middle" fill="#7dd3fc">Offline</text>
      <rect x="856" y="302" width="38" height="15" rx="4" fill="#000" fill-opacity="0.55"/><text x="875" y="313" text-anchor="middle" fill="#e2e8f0">GOG</text>
    </g>
  </g>

  <!-- Thẻ nổi: đổi tài khoản -->
  <g transform="translate(30 24)">
  <g filter="url(#shadow)">
    <rect x="586" y="268" width="196" height="92" rx="14" fill="#121826" stroke="#38bdf8" stroke-opacity="0.45"/>
  </g>
  <circle cx="614" cy="296" r="13" fill="#f97316"/>
  <circle cx="614" cy="334" r="13" fill="#22d3ee"/>
  <text x="636" y="300" font-size="12" font-weight="700" fill="#f1f5f9">Tài khoản chính</text>
  <text x="636" y="338" font-size="12" font-weight="700" fill="#f1f5f9">Tài khoản phụ</text>
  <rect x="726" y="327" width="46" height="16" rx="5" fill="#38bdf8" fill-opacity="0.18"/>
  <text x="749" y="339" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">OFFLINE</text>
  <path d="M752 290 l6 6 l10 -12" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
